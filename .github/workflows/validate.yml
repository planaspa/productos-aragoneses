name: Validar datos

on:
  pull_request:
    paths:
      - "**.csv"
      - "schemas/**"
      - "scripts/**"
      - "datapackage.json"
  push:
    branches: [main]
    paths:
      - "**.csv"
      - "schemas/**"
      - "scripts/**"
      - "datapackage.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar CSV y exportar JSON
        run: python3 scripts/check.py

      - name: Comprobar JSON sincronizado
        run: |
          git diff --exit-code docs/datos/ || (
            echo "Ejecuta: python3 scripts/check.py"
            exit 1
          )
